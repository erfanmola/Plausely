name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests
        run: swift test --package-path Packages/PlauselyKit
      - name: macOS Debug build
        run: >
          xcodebuild -project Plausely.xcodeproj -scheme Plausely-macOS
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- build
      - name: iOS simulator Debug build
        run: >
          xcodebuild -project Plausely.xcodeproj -scheme Plausely-iOS
          -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO build
      # UI suites do not run on CI: the mac virtual display cannot host
      # native menus/sheets, and simulator UI runs are timing-sensitive to
      # runner load. They run locally via ./scripts/check.sh, which remains
      # the full gate. CI covers package tests plus all four builds.
      - name: macOS Release build
        run: >
          xcodebuild -project Plausely.xcodeproj -scheme Plausely-macOS
          -configuration Release -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- build
      - name: iOS simulator Release build
        run: >
          xcodebuild -project Plausely.xcodeproj -scheme Plausely-iOS
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
